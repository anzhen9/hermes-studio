[env:esp32-s3-devkitc-1]
; 必须锁定官方 espressif32 6.x（Arduino core 2.0.x / IDF 4.4）：
; core 2.0.13+ / 3.x 的 soc.h 定义了 REG_SPI_BASE(i)（i<2 返回 0），
; 与 S3 的 FSPI=0 叠加会把 TFT_eSPI 的 SPI 寄存器基地址算成 0，
; 首次写寄存器即 StoreProhibited 崩溃（USE_FSPI_PORT 为强制修复项）。
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM8
monitor_port = COM8
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; ---- TFT_eSPI：ST7789 240x240 SPI 屏（1.54" 单屏-插接10P-GMT154-06）----
  -D USER_SETUP_LOADED=1
  -D USE_FSPI_PORT=1
  -D ST7789_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_MOSI=1
  -D TFT_SCLK=18
  -D TFT_DC=17
  -D TFT_RST=6
  -D TFT_BL=2
  ; 本板背光低电平点亮（v1.4 固件用 analogWrite(BL,255-亮度) 反相证实），
  ; 让 tft.init() 内部开背光时也输出低电平。
  -D TFT_BL_TURNING_ON_LEVEL=0
  ; SPI 时钟必须 <=27MHz：这块屏经 10P 插接排线，40MHz 会像素流错位
  ; （整屏变形/条纹）。v1.4 固件同屏同库 27MHz 长期稳定。
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
lib_deps =
  links2004/WebSockets@^2.6.1
  olikraus/U8g2@2.36.18
  bodmer/TFT_eSPI@2.5.43
